<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Reset Password</title>
    <!-- Include jQuery from a CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
      }
      .container {
        width: 300px;
        margin: 100px auto;
        padding: 20px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
      }
      .form-group input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      #message {
        margin-bottom: 15px;
        color: red;
      }
      .success {
        color: green;
      }
      .password-requirements {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #4285f4;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #357ae8;
      }
      .login-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Reset Password</h2>
      <div id="message"></div>
      <form id="resetPasswordForm">
        <input
          type="hidden"
          id="csrf_token"
          name="csrf_token"
          value="{{ csrf_token }}"
        />
        <input type="hidden" id="token" name="token" value="{{ token }}" />
        <div class="form-group">
          <label for="password">New Password:</label>
          <input type="password" id="password" name="password" required />
          <div class="password-requirements">
            Password must meet at least 3 of these 4 criteria:<br />
            - At least 12 characters long<br />
            - Contains both uppercase and lowercase letters<br />
            - Contains at least one number<br />
            - Contains at least one special character<br />
            (Minimum length: 8 characters)
          </div>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password:</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
          />
        </div>
        <button type="submit">Reset Password</button>
      </form>
      <div class="login-link">
        <a href="/auth/login">Back to Login</a>
      </div>
    </div>

    <script>
      $(document).ready(function () {
        $("#resetPasswordForm").submit(function (e) {
          e.preventDefault(); // Prevent form from submitting normally.
          $("#message").text("").removeClass("success"); // Clear previous messages.

          var password = $("#password").val();
          var confirmPassword = $("#confirm_password").val();
          var token = $("#token").val();
          var csrfToken = $("#csrf_token").val();

          // Validate password confirmation
          if (password !== confirmPassword) {
            $("#message").text("Passwords do not match.");
            return;
          }

          $.ajax({
            url: "/auth/reset-password",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
              password: password,
              token: token,
              csrf_token: csrfToken,
            }),
            success: function (response) {
              $("#message").text(response.message).addClass("success");
              // After a short delay, redirect to login
              setTimeout(function () {
                window.location.href = "/auth/login";
              }, 3000);
            },
            error: function (xhr) {
              // Display error message
              var response = xhr.responseJSON;
              if (response && response.error) {
                $("#message").text(response.error);
              } else {
                $("#message").text("An error occurred. Please try again.");
              }
            },
          });
        });
      });
    </script>
  </body>
</html>
