<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <!-- Include jQuery from a CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }
    .container {
      width: 300px;
      margin: 100px auto;
      padding: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    #message {
      margin-bottom: 15px;
      color: red;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4285f4;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #357ae8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <div id="message"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    $(document).ready(function(){
      $('#loginForm').submit(function(e){
        e.preventDefault(); // Prevent form from submitting normally.
        $('#message').text(''); // Clear previous messages.

        var email = $('#email').val();
        var password = $('#password').val();

        $.ajax({
          url: '/auth/login',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ email: email, password: password }),
          success: function(response){
            // Check the response from the server.
            if(response.status && response.status === 'fail'){
              $('#message').text(response.error);
            } else {
              // On success, redirect to the dashboard or desired page.
              window.location.href = '/api/characteristics'; // Change to your desired landing page.
            }
          },
          error: function(jqXHR, textStatus, errorThrown){
            $('#message').text('An error occurred. Please try again.');
          }
        });
      });
    });
  </script>
</body>
</html>
