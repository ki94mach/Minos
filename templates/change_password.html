<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Change Password</title>
    <!-- Include jQuery from a CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
      }
      .container {
        width: 300px;
        margin: 100px auto;
        padding: 20px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
      }
      .form-group input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      #message {
        margin-bottom: 15px;
        color: red;
      }
      .success {
        color: green;
      }
      .password-requirements {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #4285f4;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #357ae8;
      }
      .back-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Change Password</h2>
      <div id="message"></div>
      <form id="changePasswordForm">
        <input
          type="hidden"
          id="csrf_token"
          name="csrf_token"
          value="{{ csrf_token }}"
        />
        <div class="form-group">
          <label for="current_password">Current Password:</label>
          <input
            type="password"
            id="current_password"
            name="current_password"
            required
          />
        </div>
        <div class="form-group">
          <label for="new_password">New Password:</label>
          <input
            type="password"
            id="new_password"
            name="new_password"
            required
          />
          <div class="password-requirements">
            Password must meet at least 3 of these 4 criteria:<br />
            - At least 12 characters long<br />
            - Contains both uppercase and lowercase letters<br />
            - Contains at least one number<br />
            - Contains at least one special character<br />
            (Minimum length: 8 characters)
          </div>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm New Password:</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
          />
        </div>
        <button type="submit">Change Password</button>
      </form>
      <div class="back-link">
        <a href="/api/characteristics">Back to Dashboard</a>
      </div>
    </div>

    <script>
      $(document).ready(function () {
        $("#changePasswordForm").submit(function (e) {
          e.preventDefault(); // Prevent form from submitting normally.
          $("#message").text("").removeClass("success"); // Clear previous messages.

          var currentPassword = $("#current_password").val();
          var newPassword = $("#new_password").val();
          var confirmPassword = $("#confirm_password").val();
          var csrfToken = $("#csrf_token").val();

          // Validate password confirmation
          if (newPassword !== confirmPassword) {
            $("#message").text("New passwords do not match.");
            return;
          }

          $.ajax({
            url: "/auth/change-password",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
              current_password: currentPassword,
              new_password: newPassword,
              csrf_token: csrfToken,
            }),
            success: function (response) {
              $("#message").text(response.message).addClass("success");
              // Clear the form
              $("#changePasswordForm")[0].reset();
            },
            error: function (xhr) {
              // Display error message
              var response = xhr.responseJSON;
              if (response && response.error) {
                $("#message").text(response.error);
              } else {
                $("#message").text("An error occurred. Please try again.");
              }
            },
          });
        });
      });
    </script>
  </body>
</html>
