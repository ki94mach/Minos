# Minos Docker — single public port (80): nginx serves SPA and proxies /api to Gunicorn.
#
# Setup: docs/DEPLOY-DOCKER.md  |  Env files: docs/ENV.md
# 1. cp .env.docker.example .env  (set MINOS_PUBLIC_ORIGIN to http://YOUR_SERVER_IP)
# 2. docker compose build --no-cache && docker compose up -d
#
# API uses GUNICORN_BIND=0.0.0.0 so the web container can reach :5000 via
# host.docker.internal. Block LAN access to :5000 with ufw (see DEPLOY-DOCKER.md).

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    network_mode: host
    env_file: .env
    volumes:
      - minos_uploads:/app/var/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        REACT_APP_API_URL: ${MINOS_PUBLIC_ORIGIN:-http://localhost}
        REACT_APP_USE_MINOS_AUTH: "false"
        REACT_APP_ALLOW_LOCALHOST_API: ${REACT_APP_ALLOW_LOCALHOST_API:-false}
    ports:
      - "0.0.0.0:80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  minos_uploads:
