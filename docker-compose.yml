services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    network_mode: host
    env_file: .env
    volumes:
      - minos_uploads:/app/var/uploads
    restart: unless-stopped
  
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000
        REACT_APP_USE_MINOS_AUTH: "false"
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  minos_uploads:
    driver: local