stages:
  - test
  - build

# Target the shared Windows shell runner (gitlab-runner-windows, tag: shell-win).
# Jobs run on the runner host; Python and Node must be installed there.
# Orchid Nexus mirrors — same as docker/api/Dockerfile and docker/web/Dockerfile.
variables:
  PIP_INDEX_URL: "https://nexus.orchidpharmed.com/repository/pip-proxy/simple"
  PIP_TRUSTED_HOST: "nexus.orchidpharmed.com"
  NPM_CONFIG_REGISTRY: "https://nexus.orchidpharmed.com/repository/npm-proxy/"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

default:
  tags:
    - shell-win

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .cache/npm
    - node_modules/

backend-tests:
  stage: test
  before_script:
    - python -m pip install --no-cache-dir --upgrade pip
    - python -m pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
  script:
    - python -m pytest --cov=utils --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - report.xml
    expire_in: 1 week

frontend-tests:
  stage: test
  variables:
    NODE_ENV: development
    CI: "true"
  before_script:
    - npm ci
  script:
    - npm test -- --coverage --watchAll=false
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week

spa-build:
  stage: build
  needs:
    - backend-tests
    - frontend-tests
  variables:
    NODE_ENV: development
    FLASK_ENV: production
    SSO_ISSUER: https://idp.example.com/realms/minos
    SSO_AUDIENCE: minos-api
    SSO_JWKS_URL: https://idp.example.com/realms/minos/protocol/openid-connect/certs
    REACT_APP_API_URL: https://api.example.com
    REACT_APP_SSO_LOGIN_URL: https://idp.example.com/login
    REACT_APP_SSO_LOGOUT_URL: https://idp.example.com/logout
  before_script:
    - npm ci
    - python -m pip install --no-cache-dir python-dotenv
  script:
    - python scripts/audit-production-env.py
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
