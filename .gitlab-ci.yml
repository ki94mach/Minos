stages:
  - diagnostics
  - test
  - build

# Target the shared Windows shell runner (gitlab-runner-windows, tag: shell-win).
# Run the runner-diagnostics job first if Python/Node commands fail.
# Python is resolved by scripts/ci-python.ps1; if none is on the runner it bootstraps
# a project-local embeddable Python under .ci/python (cached, no admin/Nexus changes).
# Optional CI/CD overrides: PYTHON_PATH, PYTHON_VERSION, PYTHON_EMBED_URL, GET_PIP_URL.
variables:
  PIP_INDEX_URL: "https://nexus.orchidpharmed.com/repository/pip-proxy/simple"
  PIP_TRUSTED_HOST: "nexus.orchidpharmed.com"
  NPM_CONFIG_REGISTRY: "https://nexus.orchidpharmed.com/repository/npm-proxy/"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  PYTHON_VERSION: "3.12.6"

default:
  tags:
    - shell-win

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .cache/npm
    - .ci/python
    - node_modules/

runner-diagnostics:
  stage: diagnostics
  rules:
    - when: always
  script:
    - powershell -ExecutionPolicy Bypass -File scripts/ci-runner-diagnostics.ps1
  artifacts:
    when: always
    paths:
      - runner-diagnostics.txt
    expire_in: 1 week
  allow_failure: true

.backend_python: &backend_python
  - Remove-Item -ErrorAction SilentlyContinue coverage.xml, report.xml, .ci-python-path
  - powershell -ExecutionPolicy Bypass -File scripts/ci-runner-diagnostics.ps1 -Quick
  - powershell -ExecutionPolicy Bypass -File scripts/ci-python.ps1
  - powershell -ExecutionPolicy Bypass -File scripts/ci-python.ps1 -m pip install --upgrade pip
  - powershell -ExecutionPolicy Bypass -File scripts/ci-python.ps1 -m pip install -r requirements.txt -r requirements-dev.txt

backend-tests:
  stage: test
  needs:
    - job: runner-diagnostics
      artifacts: false
  before_script: *backend_python
  script:
    - powershell -ExecutionPolicy Bypass -File scripts/ci-python.ps1 -m pytest --cov=utils --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - report.xml
    expire_in: 1 week

frontend-tests:
  stage: test
  needs:
    - job: runner-diagnostics
      artifacts: false
  variables:
    NODE_ENV: development
    CI: "true"
  before_script:
    - npm ci
  script:
    - npm test -- --coverage --watchAll=false
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week

spa-build:
  stage: build
  needs:
    - backend-tests
    - frontend-tests
  variables:
    NODE_ENV: development
    FLASK_ENV: production
    SSO_ISSUER: https://idp.example.com/realms/minos
    SSO_AUDIENCE: minos-api
    SSO_JWKS_URL: https://idp.example.com/realms/minos/protocol/openid-connect/certs
    REACT_APP_API_URL: https://api.example.com
    REACT_APP_SSO_LOGIN_URL: https://idp.example.com/login
    REACT_APP_SSO_LOGOUT_URL: https://idp.example.com/logout
  before_script:
    - npm ci
    - powershell -ExecutionPolicy Bypass -File scripts/ci-python.ps1 -m pip install python-dotenv
  script:
    - powershell -ExecutionPolicy Bypass -File scripts/ci-python.ps1 scripts/audit-production-env.py
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
