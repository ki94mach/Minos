# Minos Docker web — SPA on /, API proxied to Gunicorn on the host (single public port).
# Upstream uses host.docker.internal (see extra_hosts in docker-compose.yml).

upstream minos_api {
    server host.docker.internal:5000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match Flask MAX_CONTENT_LENGTH (10MB) for patient reference uploads
    client_max_body_size 10m;

    # Flask API (JSON)
    location /api/ {
        proxy_pass http://minos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Legacy Minos session auth (optional; SSO builds may not use these)
    location /auth/ {
        proxy_pass http://minos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness/readiness (load balancers, smoke tests)
    location = /health {
        proxy_pass http://minos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # CRA hashed assets (not Flask static)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router — unknown paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
