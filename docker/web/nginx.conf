server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed CRA assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router — any unknown path → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}