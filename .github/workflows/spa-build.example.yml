# Example CI job for F10 — copy to spa-build.yml and set repository secrets/vars.
name: SPA production build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - run: npm ci

      - name: Build static SPA
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_SSO_LOGIN_URL: ${{ vars.REACT_APP_SSO_LOGIN_URL }}
          REACT_APP_SSO_LOGOUT_URL: ${{ vars.REACT_APP_SSO_LOGOUT_URL }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
