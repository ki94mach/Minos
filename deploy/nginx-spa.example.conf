# I3 / I7 — Serve CRA build/ over HTTPS with client-side routing fallback.
# Copy to your nginx sites-available and adjust server_name + ssl paths.

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name minos.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name minos.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    root /var/www/minos/build;
    index index.html;

    # Security headers (adjust CSP if you add third-party scripts)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Cache hashed static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — React Router (I7)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
